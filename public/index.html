<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crystal Prompter</title>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body class="theme-purple">

  <!-- Settings Overlay -->
  <div class="settings-overlay" id="settingsOverlay" aria-hidden="true">
    <div class="settings-modal">
      <div class="settings-header">
        <h2>Settings</h2>
        <button class="btn-close" id="btnCloseSettings" aria-label="Close">&#x2715;</button>
      </div>
      <div class="settings-body">
        <div class="settings-section">
          <span class="section-label">Background Theme</span>
          <div class="color-swatches">
            <button class="swatch active" data-theme="purple" title="Purple"></button>
            <button class="swatch" data-theme="green" title="Green"></button>
            <button class="swatch" data-theme="blue" title="Blue"></button>
            <button class="swatch" data-theme="orange" title="Orange"></button>
            <button class="swatch" data-theme="dark" title="Dark"></button>
            <label class="swatch custom-swatch" title="Custom color">
              <input type="color" id="customColor" value="#667eea"/>
              <span>&#x1F3A8;</span>
            </label>
          </div>
        </div>
        <div class="settings-section">
          <span class="section-label">Avatar Gender</span>
          <div class="gender-toggle">
            <button class="gender-btn active" data-gender="male">&#x1F468; Male</button>
            <button class="gender-btn" data-gender="female">&#x1F469; Female</button>
          </div>
        </div>
        <div class="settings-section">
          <span class="section-label">Language</span>
          <div class="lang-grid">
            <button class="lang-opt" data-lang="auto">&#x1F310; Auto</button>
            <button class="lang-opt active" data-lang="en">&#x1F1FA;&#x1F1F8; EN</button>
            <button class="lang-opt" data-lang="ceb">&#x1F1F5;&#x1F1ED; CEB</button>
            <button class="lang-opt" data-lang="fil">&#x1F1F5;&#x1F1ED; FIL</button>
            <button class="lang-opt" data-lang="es">&#x1F1EA;&#x1F1F8; ES</button>
            <button class="lang-opt" data-lang="ko">&#x1F1F0;&#x1F1F7; KO</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Language Picker Popup -->
  <div class="lang-picker" id="langPicker">
    <button class="lang-pick-btn" data-lang="auto">&#x1F310; Auto</button>
    <button class="lang-pick-btn active" data-lang="en">&#x1F1FA;&#x1F1F8; EN</button>
    <button class="lang-pick-btn" data-lang="ceb">&#x1F1F5;&#x1F1ED; CEB</button>
    <button class="lang-pick-btn" data-lang="fil">&#x1F1F5;&#x1F1ED; FIL</button>
    <button class="lang-pick-btn" data-lang="es">&#x1F1EA;&#x1F1F8; ES</button>
    <button class="lang-pick-btn" data-lang="ko">&#x1F1F0;&#x1F1F7; KO</button>
  </div>

  <!-- App -->
  <div class="app-wrap">

    <!-- Header -->
    <header class="app-header">
      <div class="header-dt">
        <span class="hdr-date" id="headerDate"></span>
        <span class="hdr-time" id="headerTime"></span>
      </div>
      <div class="header-brand">
        <img
          class="brand-logo"
          src="https://static.wixstatic.com/media/d0630a_9680d5ad465147a4bd244f7b9d0acc44~mv2.png/v1/crop/x_63,y_399,w_937,h_221/fill/w_390,h_100,fp_0.50_0.50,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/CP_edited.png"
          alt="Crystal Prompter"
        />
      </div>
      <div class="header-right">
        <button class="btn-icon" id="btnSettings" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Area -->
    <main class="app-main">

      <!-- Avatar Panel (left, 190px) -->
      <section class="avatar-panel">
        <div class="avatar-stage" id="avatarStage">
          <div class="avatar-aura"></div>
          <img class="avatar-img" id="avatarImg" src="./avatar-male.svg" alt="Assistant Avatar"/>
          <div class="avatar-ring"></div>
        </div>
        <div class="avatar-info">
          <span class="av-name">Assistant</span>
          <span class="av-status" id="avStatus">
            <span class="dot"></span>Online
          </span>
        </div>
      </section>

      <!-- Content Panel (right) -->
      <section class="content-panel">
        <!-- Category Buttons -->
        <div class="category-list" id="categoryList">
          <button class="cat-btn active" data-category="text">
            <span class="cat-ico">&#x1F4DD;</span>
            <span class="cat-lbl">Text</span>
            <span class="cat-arr">&#x203A;</span>
          </button>
          <button class="cat-btn" data-category="photos">
            <span class="cat-ico">&#x1F4F8;</span>
            <span class="cat-lbl">Photos</span>
            <span class="cat-arr">&#x203A;</span>
          </button>
          <button class="cat-btn" data-category="slides">
            <span class="cat-ico">&#x1F4CA;</span>
            <span class="cat-lbl">Slides</span>
            <span class="cat-arr">&#x203A;</span>
          </button>
          <button class="cat-btn" data-category="videos">
            <span class="cat-ico">&#x1F3AC;</span>
            <span class="cat-lbl">Videos</span>
            <span class="cat-arr">&#x203A;</span>
          </button>
          <button class="cat-btn" data-category="3d">
            <span class="cat-ico">&#x1F3A8;</span>
            <span class="cat-lbl">3D Modeling</span>
            <span class="cat-arr">&#x203A;</span>
          </button>
        </div>

        <!-- Chat History -->
        <div class="chat-messages" id="chatMessages"></div>
      </section>

    </main>

    <!-- Quick Prompt Chips -->
    <div class="chips-bar">
      <button class="chip" data-prompt="Write me a short creative poem">&#x2728; Write poem</button>
      <button class="chip" data-prompt="Describe a beautiful photo scene I can create">&#x1F4F8; Photo idea</button>
      <button class="chip" data-prompt="Create a presentation outline on technology trends">&#x1F4CA; Make slides</button>
      <button class="chip" data-prompt="Suggest an engaging video concept for social media">&#x1F3AC; Video idea</button>
      <button class="chip" data-prompt="Describe a 3D model concept I can build">&#x1F3A8; 3D concept</button>
    </div>

    <!-- Input Bar -->
    <div class="input-bar">
      <button class="btn-lang-toggle" id="btnLangToggle" aria-label="Select language">
        <span id="langLabel">&#x1F1FA;&#x1F1F8; EN</span>
      </button>
      <button class="btn-mic" id="btnMic" aria-label="Voice input" title="Tap: voice  |  Double-tap: keyboard">
        <span class="mic-icon" id="micIcon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </span>
      </button>
      <div class="input-wrap">
        <input type="text" id="chatInput" class="chat-input" placeholder="Ask Anything..." autocomplete="off"/>
      </div>
      <button class="btn-send" id="btnSend" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>

  </div><!-- .app-wrap -->

  <script type="module" src="./app.js"></script>
</body>
</html>
